<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<title>Details</title>

<style>

body{
margin:0;
font-family:Quicksand;
overflow:hidden;
}

/* SKY SAME SYSTEM */
.sky{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

.cloud{position:absolute;width:130%;opacity:.9;}
.sun,.moon{
position:absolute;
width:140px;
top:60px;
right:60px;
transition:opacity 1s;
}

.sun{filter:drop-shadow(0 0 35px gold);}
.moon{filter:drop-shadow(0 0 25px white);opacity:0;}

.star{
position:absolute;
width:2px;height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* card */
.card{
max-width:520px;
margin:40px auto;
background:rgba(0,0,0,.65);
padding:20px;
border-radius:12px;
color:white;
text-align:center;
}

/* slideshow */
img{
width:100%;
height:auto;
border-radius:12px;
transition:opacity 1s;
}

/* buttons */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
}

/* spotify */
iframe{
width:100%;
height:352px;
margin-top:15px;
border-radius:12px;
}

.toggle{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
color:white;
}

</style>
</head>

<body>

<div class="sky" id="sky"></div>
<div class="toggle" onclick="toggle()">🌓</div>

<div class="card">

<h2 id="msg"></h2>
<p id="details"></p>

<img id="slide">

<div id="maps"></div>

<iframe id="music" allow="autoplay"></iframe>

</div>

<script src="config.js"></script>

<script>

/* message */
msg.innerText=CONFIG.message;
details.innerText=CONFIG.details;

/* slideshow */
let i=0;
const slide=document.getElementById("slide");
function next(){
slide.style.opacity=0;
setTimeout(()=>{
slide.src=CONFIG.photos[i];
slide.style.opacity=1;
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
setInterval(next,3000);

/* maps */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>window.open(loc.link);
maps.appendChild(b);
});

/* music autoplay attempt */
music.src=CONFIG.musicEmbed;

/* build sky (same as landing) */
const sky=document.getElementById("sky");

CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(20+i*20)+"%";
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
sky.appendChild(moon);

/* stars */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* mode sync */
let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

</script>
</body>
</html>
