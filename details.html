<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

/* ---------- BASE ---------- */

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Quicksand;
overflow-y:auto;
overflow-x:hidden;
color:white;
transition:background 1s;
-webkit-overflow-scrolling:touch;
}

/* DAY / NIGHT BACKGROUND */

.day{
background:linear-gradient(#2e7ac7,#a6d5ff);
}

.night{
background:#02030a;
}

/* ---------- SKY ---------- */

.sky{
position:fixed;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
transform:translateZ(0);
}

.cloud{
position:absolute;
width:160%;
opacity:.85;
animation:drift linear infinite;
will-change:transform;
}

@keyframes drift{
from{transform:translateX(0)}
to{transform:translateX(-40%)}
}

.sun,.moon{
position:absolute;
width:130px;
top:60px;
right:60px;
transition:opacity 1s;
will-change:opacity;
}

/* ---------- STARS ---------- */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 6px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* ---------- CARD ---------- */

.card{
max-width:520px;
margin:40px auto;
background:rgba(0,0,0,.55);
padding:20px;
border-radius:14px;
text-align:center;
backdrop-filter:blur(4px);
}

/* COUNTDOWN */

.timer{
font-size:20px;
margin:10px 0 20px;
font-weight:600;
}

/* SLIDESHOW */

img{
width:100%;
height:auto;
border-radius:12px;
transition:opacity 1s;
will-change:opacity;
}

/* BUTTONS */

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
font-size:15px;
}

/* MUSIC */

iframe{
width:100%;
height:352px;
border-radius:12px;
margin-top:15px;
}

/* FLOATING HEARTS */

.heart{
position:fixed;
bottom:-10px;
font-size:18px;
animation:float 6s linear infinite;
z-index:-1;
will-change:transform;
}

@keyframes float{
to{
transform:translateY(-110vh);
opacity:0;
}
}

/* TOGGLE */

.toggle{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body class="day">

<div class="sky" id="sky"></div>
<div class="toggle" onclick="toggle()">🌓</div>

<div class="card">

<h2 id="msg"></h2>
<p id="details"></p>

<div id="countdown" class="timer"></div>

<img id="slide">

<div id="maps"></div>

<iframe id="music"></iframe>

</div>

<script src="config.js"></script>

<script>

/* ---------- TEXT ---------- */

msg.innerText = CONFIG.message;
details.innerText = CONFIG.details;

/* ---------- COUNTDOWN ---------- */

const target = new Date(CONFIG.date).getTime();

setInterval(()=>{
let now = new Date().getTime();
let diff = target - now;

let d = Math.floor(diff/(1000*60*60*24));
let h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m = Math.floor((diff%(1000*60*60))/(1000*60));
let s = Math.floor((diff%(1000*60))/1000);

countdown.innerText = `Countdown: ${d}d ${h}h ${m}m ${s}s`;
},1000);

/* ---------- PRELOAD IMAGES ---------- */

CONFIG.photos.forEach(src=>{
let i=new Image();
i.src=src;
});

/* ---------- SLIDESHOW ---------- */

let idx=0;
const slide=document.getElementById("slide");

function next(){
slide.style.opacity=0;

setTimeout(()=>{
slide.src=CONFIG.photos[idx];
slide.style.opacity=1;
idx=(idx+1)%CONFIG.photos.length;
},500);
}

next();

let scrolling=false;
window.addEventListener("scroll",()=>{
scrolling=true;
setTimeout(()=>scrolling=false,300);
});

setInterval(()=>{
if(!scrolling) next();
},5000);

/* ---------- MAP BUTTONS ---------- */

CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>window.open(loc.link);
maps.appendChild(b);
});

/* ---------- MUSIC ---------- */

if(localStorage.getItem("playMusic")==="yes"){
music.src=CONFIG.musicEmbed + "?autoplay=1";
}

/* ---------- SKY BUILD ---------- */

CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(10+i*20)+"%";
img.style.animationDuration=(60+i*20)+"s";
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
moon.style.opacity=0;
sky.appendChild(moon);

/* ---------- STARS ---------- */

for(let i=0;i<150;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* ---------- FLOATING HEARTS ---------- */

let heartRate=300;

if(window.innerWidth < 700){
heartRate=600;   // ultra smooth mobile mode
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},heartRate);

/* ---------- MODE SYNC ---------- */

let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
document.body.className=mode;
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

/* ---------- MOBILE GPU THROTTLE ---------- */

if(window.innerWidth < 700){
document.querySelectorAll(".star").forEach((s,i)=>{
if(i%2===0) s.remove();
});
}

</script>
</body>
</html>
