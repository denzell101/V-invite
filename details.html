<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Quicksand;
overflow:hidden;
color:white;
}

/* SKY */
.sky{
position:fixed;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
}

.cloud{
position:absolute;
width:160%;
opacity:.85;
animation:drift linear infinite;
}

@keyframes drift{
from{transform:translateX(0)}
to{transform:translateX(-40%)}
}

.sun,.moon{
position:absolute;
width:130px;
top:60px;
right:60px;
transition:opacity 1s;
}

/* STARS */
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 6px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* CARD */
.card{
max-width:520px;
margin:40px auto;
background:rgba(0,0,0,.6);
padding:20px;
border-radius:14px;
text-align:center;
}

/* SLIDESHOW */
img{
width:100%;
height:auto;
border-radius:12px;
transition:opacity 1s;
}

/* BUTTONS */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
font-size:15px;
}

/* MUSIC */
iframe{
width:100%;
height:352px;
border-radius:12px;
margin-top:15px;
}

/* HEARTS */
.heart{
position:fixed;
bottom:-10px;
font-size:18px;
animation:float 6s linear infinite;
z-index:-1;
}

@keyframes float{
to{
transform:translateY(-110vh);
opacity:0;
}
}

/* TOGGLE */
.toggle{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="sky" id="sky"></div>

<div class="toggle" onclick="toggle()">🌓</div>

<div class="card">

<h2 id="msg"></h2>
<p id="details"></p>

<img id="slide">

<div id="maps"></div>

<button onclick="startMusic()">Play Music ❤️</button>
<iframe id="music"></iframe>

</div>

<script src="config.js"></script>

<script>

/* TEXT */
msg.innerText=CONFIG.message;
details.innerText=CONFIG.details;

/* SLIDESHOW */
let i=0;
const slide=document.getElementById("slide");

function next(){
slide.style.opacity=0;

setTimeout(()=>{
slide.src=CONFIG.photos[i];
slide.style.opacity=1;
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
setInterval(next,3000);

/* MAP BUTTONS */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>window.open(loc.link);
maps.appendChild(b);
});

/* MUSIC */
function startMusic(){
music.src=CONFIG.musicEmbed + "?autoplay=1";
}

/* SKY BUILD */
CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(10+i*20)+"%";
img.style.animationDuration=(60+i*20)+"s";
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
moon.style.opacity=0;
sky.appendChild(moon);

/* STARS */
for(let i=0;i<150;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* FLOATING HEARTS */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

/* MODE SYNC */
let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

</script>
</body>
</html>
