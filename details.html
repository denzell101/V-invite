<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Quicksand;overflow-y:auto;color:white;transition:background 1s;}
.day{background:linear-gradient(#2e7ac7,#a6d5ff);}
.night{background:#02030a;}

.star{
position:absolute;
width:3px;height:3px;
background:#FFD76A;
border-radius:50%;
box-shadow:0 0 8px #FFD76A, 0 0 14px #FFC94D;
animation:twinkle 2s infinite alternate;
}

.card{max-width:520px;margin:40px auto;background:rgba(0,0,0,.55);padding:20px;border-radius:14px;text-align:center;}
img{width:100%;border-radius:12px;}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#ff4d6d;color:white;}

.routePanel{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.9);
display:none;align-items:center;justify-content:center;
z-index:999;
}
.routePanel img{max-width:90%;border-radius:12px;}

.timer{font-size:20px;margin:10px 0;}
</style>
</head>

<body class="day">

<div class="card">
<h2 id="msg"></h2>
<p id="details"></p>
<div id="countdown" class="timer"></div>

<img id="slide">

<div id="maps"></div>

<iframe id="music" width="100%" height="352" style="border-radius:12px"></iframe>
</div>

<div id="routePanel" class="routePanel" onclick="this.style.display='none'">
<img id="routeImage">
</div>

<script src="config.js"></script>

<script>
msg.innerText=CONFIG.message;
details.innerText=CONFIG.details;

const target=new Date(CONFIG.date).getTime();
setInterval(()=>{
let diff=target-Date.now();
let d=Math.floor(diff/86400000);
let h=Math.floor((diff%86400000)/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);
countdown.innerText=`Countdown: ${d}d ${h}h ${m}m ${s}s`;
},1000);

let i=0;
CONFIG.photos.forEach(p=>{let im=new Image();im.src=p;});
function next(){
slide.style.opacity=0;
setTimeout(()=>{
slide.src=CONFIG.photos[i];
slide.style.opacity=1;
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
setInterval(next,5000);

CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>{
routeImage.src=loc.image;
routePanel.style.display="flex";
};
maps.appendChild(b);
});

if(localStorage.getItem("playMusic")==="yes")
music.src=CONFIG.musicEmbed+"?autoplay=1";
</script>
</body>
</html>
