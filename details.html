<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Date ❤️</title>

<style>
body{
margin:0;
background:#111;
color:white;
text-align:center;
font-family:sans-serif;
overflow-x:hidden;
}

/* Floating hearts */
.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation: float 6s linear infinite;
}
@keyframes float{
to{transform:translateY(-110vh);opacity:0;}
}

/* Card */
.card{
background:#222;
margin:30px auto;
padding:25px;
border-radius:12px;
max-width:420px;
}

/* Slideshow */
img{
width:100%;
border-radius:12px;
margin-top:12px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
font-size:16px;
}

iframe{
width:100%;
height:80px;
margin-top:15px;
border-radius:12px;
}

</style>
</head>

<body>

<div class="card">

<h2 id="type"></h2>

<p id="details"></p>

<img id="slide">

<div id="maps"></div>

<iframe id="music" frameborder="0"
allow="autoplay; encrypted-media"></iframe>

</div>

<script src="config.js"></script>

<script>

/* Floating hearts */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);


/* Typewriter message */
let msg = CONFIG.message;
let i=0;
function type(){
if(i<msg.length){
document.getElementById("type").innerHTML += msg.charAt(i);
i++;
setTimeout(type,40);
}
}
type();

/* Details */
document.getElementById("details").innerText=CONFIG.details;

/* Slideshow */
let idx=0;
function show(){
document.getElementById("slide").src=CONFIG.photos[idx];
idx=(idx+1)%CONFIG.photos.length;
}
show();
setInterval(show,2500);

/* Maps */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText="Open Map: "+loc.name;
b.onclick=()=>window.open(loc.link,"_blank");
document.getElementById("maps").appendChild(b);
});

/* Music */
document.getElementById("music").src=CONFIG.musicEmbed;

</script>

</body>
</html>
