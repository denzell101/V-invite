<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<title>Our Date</title>

<style>

body{
margin:0;
font-family:Montserrat;
background:#111;
color:white;
text-align:center;
}

/* Hearts */
.heart{
position:fixed;
bottom:-20px;
animation:float 6s linear infinite;
}
@keyframes float{to{transform:translateY(-110vh);opacity:0;}}

/* Card */
.card{
max-width:420px;
margin:30px auto;
padding:20px;
background:#222;
border-radius:12px;
}

/* Fade slideshow */
.slide{
width:100%;
height:240px;
background-size:cover;
background-position:center;
border-radius:12px;
opacity:1;
transition:opacity 1s;
}

/* Route animation */
svg{
width:100%;
margin-top:20px;
}

path{
stroke:#ff4d6d;
stroke-width:3;
fill:none;
stroke-dasharray:500;
stroke-dashoffset:500;
animation:draw 3s forwards;
}

@keyframes draw{
to{stroke-dashoffset:0;}
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
}

</style>
</head>

<body>

<div class="card">

<h2 id="msg" style="font-family:'Great Vibes';"></h2>

<div id="slide" class="slide"></div>

<svg viewBox="0 0 200 100">
<path d="M10 80 Q100 10 190 80"/>
</svg>

<div id="maps"></div>

<button onclick="playMusic()">Play Music ❤️</button>

<iframe id="music" style="display:none"
allow="autoplay"></iframe>

</div>

<script src="config.js"></script>

<script>

/* hearts */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

/* message */
document.getElementById("msg").innerText=CONFIG.message;

/* fade slideshow */
let i=0;
const slide=document.getElementById("slide");

function next(){
slide.style.opacity=0;

setTimeout(()=>{
slide.style.backgroundImage=`url(${CONFIG.photos[i]})`;
slide.style.opacity=1;
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
setInterval(next,3000);

/* maps */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>window.open(loc.link);
document.getElementById("maps").appendChild(b);
});

/* mobile-safe music */
function playMusic(){
let m=document.getElementById("music");
m.src=CONFIG.musicEmbed;
m.style.display="block";
}

</script>

</body>
</html>
