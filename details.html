<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<title>Details</title>

<style>

body{
margin:0;
font-family:Quicksand;
background:#111;
color:white;
text-align:center;
}

/* floating hearts */
.heart{
position:fixed;
bottom:-10px;
animation:float 6s linear infinite;
}
@keyframes float{
to{transform:translateY(-110vh);opacity:0;}
}

/* card */
.card{
max-width:480px;
margin:30px auto;
padding:20px;
background:#222;
border-radius:12px;
}

/* FULL IMAGE */
img{
width:100%;
height:auto;
border-radius:12px;
}

/* fade */
.fade{
opacity:0;
transition:opacity 1s;
}

/* buttons */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
}

/* spotify */
iframe{
width:100%;
height:352px;
margin-top:15px;
border-radius:12px;
}

</style>
</head>

<body>

<div class="card">

<h2 id="msg" style="font-family:'Playfair Display'"></h2>

<img id="slide">

<div id="maps"></div>

<iframe id="music" frameborder="0"
allow="autoplay; encrypted-media"></iframe>

</div>

<script src="config.js"></script>

<script>

/* hearts */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

/* message */
document.getElementById("msg").innerText=CONFIG.message;

/* slideshow */
let i=0;
const img=document.getElementById("slide");

function next(){
img.classList.add("fade");

setTimeout(()=>{
img.src=CONFIG.photos[i];
img.classList.remove("fade");
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
setInterval(next,3000);

/* maps */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>window.open(loc.link);
document.getElementById("maps").appendChild(b);
});

/* spotify */
document.getElementById("music").src =
"https://open.spotify.com/embed/track/1fzAuUVbzlhZ1lJAx9PtY6";

</script>
</body>
</html>
