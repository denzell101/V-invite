<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Quicksand;
overflow-y:auto;
color:white;
transition:background 1s;
}

.day{background:linear-gradient(#2e7ac7,#a6d5ff);}
.night{background:#02030a;}

/* SAME SKY DEPTH SYSTEM */

.sky{position:fixed;width:100%;height:100%;pointer-events:none;}
.sky-back{z-index:-5;}
.sky-mid{z-index:-4;}
.sky-front{z-index:-3;}

.star{
position:absolute;
width:3px;height:3px;
background:#FFD76A;
border-radius:50%;
box-shadow:0 0 10px #FFD76A;
animation:twinkle 2s infinite alternate;
transition:opacity .6s;
}

.day .star{opacity:.15;}
.night .star{opacity:1;}

.cloud{
position:absolute;
width:160%;
opacity:.9;
animation:drift linear infinite;
}

.sun,.moon{
position:absolute;
width:130px;
top:60px;
right:60px;
transition:opacity 1s;
}

/* CARD */

.card{
max-width:520px;
margin:40px auto;
background:rgba(0,0,0,.55);
padding:20px;
border-radius:14px;
text-align:center;
z-index:10;
position:relative;
}

img{width:100%;border-radius:12px;}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#ff4d6d;color:white;}

.toggle{
position:absolute;
top:15px;right:20px;
font-size:22px;
cursor:pointer;
z-index:20;
}

.routePanel{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}
.routePanel img{max-width:90%;border-radius:12px;}

.timer{font-size:20px;margin:10px 0;}

</style>
</head>

<body class="day">

<div class="sky sky-back" id="skyStars"></div>
<div class="sky sky-mid" id="skyClouds"></div>
<div class="sky sky-front" id="skyFront"></div>

<div class="toggle" onclick="toggle()">🌓</div>

<div class="card">

<h2 id="msg"></h2>
<p id="details"></p>

<div id="countdown" class="timer"></div>

<img id="slide">
<div id="maps"></div>

<iframe id="music" width="100%" height="352" style="border-radius:12px"></iframe>

</div>

<div id="routePanel" class="routePanel" onclick="this.style.display='none'">
<img id="routeImage">
</div>

<script src="config.js"></script>

<script>

msg.innerText=CONFIG.message;
details.innerText=CONFIG.details;

/* BUILD SKY */

for(let i=0;i<150;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
skyStars.appendChild(s);
}

CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(10+i*20)+"%";
img.style.animationDuration=(60+i*20)+"s";
skyClouds.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
skyFront.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
moon.style.opacity=0;
skyFront.appendChild(moon);

/* MODE */
let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
document.body.className=mode;
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

/* COUNTDOWN */
const target=new Date(CONFIG.date).getTime();
setInterval(()=>{
let diff=target-Date.now();
countdown.innerText=
Math.floor(diff/86400000)+"d "+
Math.floor(diff%86400000/3600000)+"h "+
Math.floor(diff%3600000/60000)+"m "+
Math.floor(diff%60000/1000)+"s";
},1000);

/* SLIDESHOW */
let i=0;
function next(){
slide.src=CONFIG.photos[i];
i=(i+1)%CONFIG.photos.length;
}
next();
setInterval(next,5000);

/* ROUTE BUTTONS */
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>{
routeImage.src=loc.image;
routePanel.style.display="flex";
};
maps.appendChild(b);
});

/* MUSIC */
if(localStorage.getItem("playMusic")==="yes")
music.src=CONFIG.musicEmbed+"?autoplay=1";

</script>
</body>
</html>
