<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

/* ---------- BASE ---------- */

body{
margin:0;
font-family:Quicksand;
overflow-y:auto;
overflow-x:hidden;
color:white;
transition:background 1s;
-webkit-overflow-scrolling:touch;
}

.day{ background:linear-gradient(#2e7ac7,#a6d5ff); }
.night{ background:#02030a; }

/* ---------- SKY ---------- */

.sky{
position:fixed;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
}

.cloud{
position:absolute;
width:160%;
opacity:.85;
animation:drift linear infinite;
}

@keyframes drift{
from{transform:translateX(0)}
to{transform:translateX(-40%)}
}

.sun,.moon{
position:absolute;
width:130px;
top:60px;
right:60px;
transition:opacity 1s;
}

.star{
position:absolute;
width:3px;height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 6px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* ---------- CARD ---------- */

.card{
max-width:520px;
margin:40px auto;
background:rgba(0,0,0,.55);
padding:20px;
border-radius:14px;
text-align:center;
backdrop-filter:blur(4px);
}

.timer{
font-size:20px;
margin:10px 0 20px;
font-weight:600;
}

img{
width:100%;
border-radius:12px;
transition:opacity 1s;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
font-size:15px;
}

iframe{
width:100%;
height:352px;
border-radius:12px;
margin-top:15px;
}

/* ---------- HEARTS ---------- */

.heart{
position:fixed;
bottom:-10px;
font-size:18px;
animation:float 6s linear infinite;
z-index:-1;
}

@keyframes float{
to{transform:translateY(-110vh);opacity:0;}
}

/* ---------- ROUTE PANEL ---------- */

.routePanel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.routeCard{
width:90%;
max-width:600px;
background:#111;
padding:20px;
border-radius:14px;
}

.routeBox{ position:relative; }
.map{ width:100%; border-radius:12px; }

.routeSVG{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

/* path animation */
.routeSeg{
filter:drop-shadow(0 0 6px #ff4d6d);
stroke-dasharray:600;
stroke-dashoffset:600;
animation:draw 2s ease forwards;
}

.routeSeg:nth-child(2){
animation-delay:1.6s;
}

.pin{
fill:#ff4d6d;
opacity:0;
animation:pop .6s ease forwards;
animation-delay:3.2s;
}

@keyframes draw{
to{stroke-dashoffset:0;}
}

@keyframes pop{
to{opacity:1; transform:scale(1.4);}
}

.toggle{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body class="day">

<div class="sky" id="sky"></div>
<div class="toggle" onclick="toggle()">🌓</div>

<div class="card">

<h2 id="msg"></h2>
<p id="details"></p>

<div id="countdown" class="timer"></div>

<img id="slide">

<div id="maps"></div>

<iframe id="music"></iframe>

</div>

<!-- ROUTE OVERLAY -->
<div id="routePanel" class="routePanel">
<div class="routeCard">

<h3 id="routeTitle"></h3>

<div class="routeBox">
<img src="route.jpg" class="map">

<svg viewBox="0 0 500 300" class="routeSVG">

<defs>
<linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff7aa8"/>
<stop offset="100%" stop-color="#ff2e63"/>
</linearGradient>
</defs>

<path class="routeSeg"
d="M40 250 Q150 120 250 150"
stroke="url(#glow)" stroke-width="4" fill="none"/>

<path class="routeSeg"
d="M250 150 Q350 100 460 130"
stroke="url(#glow)" stroke-width="4" fill="none"/>

<circle class="pin" cx="40" cy="250" r="6"/>
<circle class="pin" cx="250" cy="150" r="6"/>
<circle class="pin" cx="460" cy="130" r="6"/>

</svg>
</div>

<button onclick="openMaps()">Open in Google Maps</button>
<button onclick="closeRoute()">Close</button>

</div>
</div>

<script src="config.js"></script>

<script>

/* TEXT */
msg.innerText=CONFIG.message;
details.innerText=CONFIG.details;

/* COUNTDOWN */
const target=new Date(CONFIG.date).getTime();
setInterval(()=>{
let diff=target-Date.now();
let d=Math.floor(diff/86400000);
let h=Math.floor((diff%86400000)/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);
countdown.innerText=`Countdown: ${d}d ${h}h ${m}m ${s}s`;
},1000);

/* SLIDESHOW */
let i=0;
CONFIG.photos.forEach(p=>{let im=new Image(); im.src=p;});
function next(){
slide.style.opacity=0;
setTimeout(()=>{
slide.src=CONFIG.photos[i];
slide.style.opacity=1;
i=(i+1)%CONFIG.photos.length;
},500);
}
next();
let scrolling=false;
window.addEventListener("scroll",()=>{scrolling=true;setTimeout(()=>scrolling=false,300);});
setInterval(()=>{if(!scrolling)next();},5000);

/* MAP BUTTONS */
let currentLink="";
CONFIG.locations.forEach(loc=>{
let b=document.createElement("button");
b.innerText=loc.name;
b.onclick=()=>{
routeTitle.innerText=loc.name;
currentLink=loc.link;
routePanel.style.display="flex";
};
maps.appendChild(b);
});

/* ROUTE CONTROL */
function closeRoute(){routePanel.style.display="none";}
function openMaps(){window.open(currentLink);}

/* MUSIC */
if(localStorage.getItem("playMusic")==="yes")
music.src=CONFIG.musicEmbed+"?autoplay=1";

/* SKY BUILD */
CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(10+i*20)+"%";
img.style.animationDuration=(60+i*20)+"s";
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
moon.style.opacity=0;
sky.appendChild(moon);

for(let i=0;i<150;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}, window.innerWidth<700?600:300);

/* MODE */
let mode=localStorage.getItem("mode")||"day";
apply();
function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}
function apply(){
document.body.className=mode;
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

</script>
</body>
</html>
