<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

/* GPU isolation */
*{
will-change: transform;
}

body{
margin:0;
font-family:Quicksand;
overflow:hidden;
perspective:900px;
}

/* Envelope Physics */
.envelope{
width:360px;
height:220px;
background:#ff4d6d;
border-radius:12px;
cursor:pointer;
position:relative;
transform-style:preserve-3d;
transition:transform .6s cubic-bezier(.25,1.5,.5,1);
}

.flap{
height:120px;
background:#ff758f;
transform-origin:top;
transition:transform .9s cubic-bezier(.34,1.56,.64,1);
}

.letter{
background:white;
width:320px;
height:170px;
position:absolute;
top:25px;
left:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-family:"Playfair Display";
font-size:22px;
color:#ff4d6d;
transform:translateZ(0);
transition:transform .8s cubic-bezier(.25,1.4,.5,1);
}

.open .flap{
transform:rotateX(-170deg) translateZ(10px);
}

.open .letter{
transform:translateY(-180px) translateZ(60px);
}

/* center */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* button */
button{
margin-top:10px;
padding:12px 28px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
}

</style>
</head>

<body>

<div class="center">
<div id="env" class="envelope" onclick="openEnv()">
<div class="flap"></div>

<div class="letter">
<div id="title"></div>
<button onclick="accept(event)">Accept ❤️</button>
</div>
</div>
</div>

<script src="config.js"></script>

<script>
title.innerText=CONFIG.title;

function openEnv(){
env.classList.add("open");
}

/* physics delay before redirect */
function accept(e){
e.stopPropagation();

env.style.transform="scale(1.05) rotateY(6deg)";

setTimeout(()=>{
env.style.transform="scale(.8) translateZ(-300px)";
},180);

setTimeout(()=>{
localStorage.setItem("playMusic","yes");
location="details.html";
},650);
}
</script>

</body>
</html>
