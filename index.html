<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invite ❤️</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    color:white;
    text-align:center;
    background: linear-gradient(-45deg,#ff4d6d,#c9184a,#720026,#ff758f);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}
@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
.card{
    background:rgba(0,0,0,.45);
    margin:40px auto;
    padding:25px;
    border-radius:12px;
    max-width:420px;
}
button{
    padding:12px 22px;
    border:none;
    border-radius:8px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    margin-top:15px;
}
#reveal{display:none;}
.timer{font-size:22px;margin-top:10px;}
iframe{border-radius:12px;margin-top:12px;}
</style>
</head>


<body>

<div class="card">

<h1 id="title"></h1>
<div id="countdown" class="timer"></div>

<button onclick="accept()">Accept ❤️</button>

<div id="reveal">

<h2 id="details"></h2>

<a id="maplink" target="_blank">
<button>Open Map</button>
</a>

<iframe id="music"
width="100%" height="80"
frameBorder="0"
allow="autoplay; encrypted-media">
</iframe>

</div>
</div>
