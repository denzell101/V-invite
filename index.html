<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#7a001f;
    font-family:sans-serif;
}

/* Envelope */
.envelope{
    width:320px;
    height:220px;
    background:#ff758f;
    position:relative;
    border-radius:6px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

/* Top flap */
.envelope:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-top:110px solid #ff4d6d;
}

/* Content */
.card{
    position:absolute;
    top:30px;
    left:20px;
    right:20px;
    text-align:center;
    color:white;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    font-size:16px;
}

/* Responsive */
@media(max-width:400px){
    .envelope{
        transform:scale(.9);
    }
}
</style>
</head>

<body>

<div class="envelope">

<div class="card">

<h2 id="title"></h2>

<button onclick="go()">Accept ❤️</button>

</div>
</div>

<script src="config.js"></script>

<script>
document.getElementById("title").innerText = CONFIG.title;

function go(){
    window.location.href="details.html";
}
</script>

</body>
</html>
