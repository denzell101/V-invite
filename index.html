<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<title>Invite</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Quicksand;
}

/* SKY */
.sky{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.cloud{
position:absolute;
width:130%;
opacity:.9;
}

.sun,.moon{
position:absolute;
width:140px;
top:60px;
right:60px;
transition:opacity 1s;
}

.sun{filter:drop-shadow(0 0 35px gold);}
.moon{filter:drop-shadow(0 0 25px white);opacity:0;}

/* stars */
.star{
position:absolute;
width:2px;height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* envelope */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.envelope{
width:340px;
height:210px;
background:#ff4d6d;
border-radius:10px;
cursor:pointer;
position:relative;
}

.flap{
height:110px;
background:#ff758f;
transform-origin:top;
transition:1s;
}

.letter{
background:white;
width:300px;
height:160px;
position:absolute;
top:25px;
left:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-family:"Playfair Display";
font-size:24px;
color:#ff4d6d;
transition:1s;
}

.open .flap{transform:rotateX(-170deg);}
.open .letter{transform:translateY(-170px);}

button{
margin-top:12px;
padding:10px 24px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
}

.toggle{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
}

/* confetti rain */
.confetti{
position:fixed;
top:-10px;
animation:fall linear forwards;
}
@keyframes fall{
to{transform:translateY(110vh);}
}

</style>
</head>

<body>

<div class="sky" id="sky"></div>

<div class="toggle" onclick="toggle()">🌓</div>

<div class="center">
<div id="env" class="envelope" onclick="openEnv()">
<div class="flap"></div>

<div class="letter">
<span id="title"></span>
<button onclick="accept(event)">Accept ❤️</button>
</div>
</div>
</div>

<script src="config.js"></script>

<script>

/* Title */
document.getElementById("title").innerText=CONFIG.title;

/* Build sky */
const sky=document.getElementById("sky");

CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(20+i*20)+"%";
img.style.animation=`drift${i} ${60+i*20}s linear infinite`;
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
sky.appendChild(moon);

/* stars */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* mode */
let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

/* envelope */
function openEnv(){env.classList.add("open");}

/* confetti */
function accept(e){
e.stopPropagation();
for(let i=0;i<80;i++){
let c=document.createElement("div");
c.className="confetti";
c.innerHTML=["❤️","✨","💖"][Math.floor(Math.random()*3)];
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(1+Math.random()*2)+"s";
document.body.appendChild(c);
}
setTimeout(()=>location="details.html",900);
}

</script>
</body>
</html>
