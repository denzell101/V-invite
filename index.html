<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Quicksand;overflow:hidden}

/* SKY */
.sky{position:fixed;width:100%;height:100%;z-index:-2;overflow:hidden}
.cloud{position:absolute;width:160%;opacity:.8;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40%)}}

/* STARS */
.star{
position:absolute;
width:3px;height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 6px white;
animation:twinkle 2s infinite alternate
}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}

.sun,.moon{
position:absolute;
width:130px;
top:60px;
right:60px;
transition:opacity 1s
}

/* ENVELOPE */
.center{height:100vh;display:flex;align-items:center;justify-content:center}
.envelope{width:360px;height:220px;background:#ff4d6d;border-radius:12px;cursor:pointer;position:relative;perspective:800px}
.flap{height:120px;background:#ff758f;transform-origin:top;transition:.8s}
.letter{background:white;width:320px;height:170px;position:absolute;top:25px;left:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Playfair Display";font-size:24px;color:#ff4d6d;transition:.8s}
.open .flap{transform:rotateX(-160deg)}
.open .letter{transform:translateY(-180px)}

button{margin-top:12px;padding:12px 28px;border:none;border-radius:8px;background:#ff4d6d;color:white;font-size:15px}

.toggle{position:absolute;top:15px;right:20px;font-size:22px;cursor:pointer}

/* CONFETTI */
.confetti{position:fixed;top:-10px;font-size:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh)}}

/* COUNTDOWN */
.timer{margin-top:10px;font-size:14px;color:#aa3355}

</style>
</head>

<body>

<div class="sky" id="sky"></div>

<div class="toggle" onclick="toggle()">🌓</div>

<div class="center">
<div id="env" class="envelope" onclick="openEnv()">
<div class="flap"></div>

<div class="letter">
<span id="title"></span>
<div id="countdown" class="timer"></div>
<button onclick="accept(event)">Accept ❤️</button>
</div>
</div>
</div>

<script src="config.js"></script>

<script>

/* TITLE */
title.innerText=CONFIG.title;

/* COUNTDOWN */
const target=new Date(CONFIG.date).getTime();
setInterval(()=>{
let now=new Date().getTime();
let d=target-now;
let days=Math.floor(d/(1000*60*60*24));
let hrs=Math.floor((d%(1000*60*60*24))/(1000*60*60));
let min=Math.floor((d%(1000*60*60))/(1000*60));
countdown.innerText=`${days}d ${hrs}h ${min}m`;
},1000);

/* SKY BUILD */
CONFIG.sky.clouds.forEach((c,i)=>{
let img=document.createElement("img");
img.src=c;
img.className="cloud";
img.style.top=(10+i*20)+"%";
img.style.animationDuration=(60+i*20)+"s";
sky.appendChild(img);
});

let sun=document.createElement("img");
sun.src=CONFIG.sky.sun;
sun.className="sun";
sky.appendChild(sun);

let moon=document.createElement("img");
moon.src=CONFIG.sky.moon;
moon.className="moon";
moon.style.opacity=0;
sky.appendChild(moon);

/* STARS */
for(let i=0;i<150;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* MODE */
let mode=localStorage.getItem("mode")||"day";
apply();

function toggle(){
mode=(mode==="day")?"night":"day";
localStorage.setItem("mode",mode);
apply();
}

function apply(){
sun.style.opacity=(mode==="day")?1:0;
moon.style.opacity=(mode==="night")?1:0;
}

/* ENVELOPE */
function openEnv(){env.classList.add("open");}

/* CONFETTI + REDIRECT */
function accept(e){
e.stopPropagation();
for(let i=0;i<80;i++){
let c=document.createElement("div");
c.className="confetti";
c.innerHTML=["❤️","✨","💖"][Math.floor(Math.random()*3)];
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(1+Math.random()*2)+"s";
document.body.appendChild(c);
}
setTimeout(()=>location="details.html",900);
}

</script>
</body>
</html>
