<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#7a001f;
font-family:sans-serif;
overflow:hidden;
}

/* Envelope */
.envelope{
position:relative;
width:320px;
height:200px;
background:#ff758f;
border-radius:8px;
cursor:pointer;
}

/* Flap */
.flap{
position:absolute;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-bottom:100px solid #ff4d6d;
top:-100px;
transform-origin:bottom;
transition:1s;
}

/* Letter */
.letter{
position:absolute;
width:280px;
height:160px;
background:white;
color:#ff4d6d;
left:20px;
top:20px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-weight:bold;
transition:1s;
}

.open .flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(-160px);
}

button{
position:absolute;
bottom:-60px;
left:50%;
transform:translateX(-50%);
padding:12px 20px;
border:none;
border-radius:8px;
background:white;
color:#ff4d6d;
font-weight:bold;
display:none;
}

.open button{
display:block;
}
</style>
</head>

<body>

<div id="env" class="envelope" onclick="openEnv()">
<div class="flap"></div>

<div class="letter">
<span id="title"></span>
</div>

<button onclick="go(event)">Accept ❤️</button>

</div>

<script src="config.js"></script>

<script>
document.getElementById("title").innerText = CONFIG.title;

function openEnv(){
document.getElementById("env").classList.add("open");
}

function go(e){
e.stopPropagation();
window.location.href="details.html";
}
</script>

</body>
</html>
